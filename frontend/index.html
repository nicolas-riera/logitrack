<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack</title>

    <link rel="stylesheet" href="styles/core.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <script type="module" src="src/app.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <h1>LogiTrack</h1>
        </div>
    </header>

    <aside class="app-sidebar" id="app-sidebar">
        <nav aria-label="Main Navigation" class="mobile-nav">
            <button id="mobile-nav-toggle" class="mobile-nav-toggle">Dashboard ▾</button>
            <ul id="nav-list">
                <li><a href="#" class="active">Dashboard</a></li>
            </ul>
        </nav>
    </aside>

    <main class="app-main">
        <section class="filter-bar" aria-label="Filters and Search">

            <div class="filter-group desktop-filters">  <!-- Desktop -->
                <button class="filter-btn active" data-status="ALL">All</button>
                <button class="filter-btn" data-status="IN_TRANSIT">In Transit</button>
                <button class="filter-btn" data-status="DELIVERED">Delivered</button>
                <button class="filter-btn" data-status="DELAYED">Delayed</button>
                <button class="filter-btn" data-status="PENDING">Pending</button>
            </div>
            
            <div class="filter-group mobile-filters-dropdown"> <!-- Mobile -->
                <select id="mobile-status-select" aria-label="Filter by Status">
                    <option value="ALL">All Statuses</option>
                    <option value="IN_TRANSIT">In Transit</option>
                    <option value="DELIVERED">Delivered</option>
                    <option value="DELAYED">Delayed</option>
                    <option value="PENDING">Pending</option>
                </select>
            </div>

            <div class="filter-right-actions">
                <div class="search-box">
                    <input type="search" id="search-input" placeholder="Search" aria-label="Search shipment">
                </div>
                <button id="btn-new-shipment" class="btn-primary">+ New Shipment</button>
            </div>
        </section>

        <section class="shipments-section" aria-label="Shipment List">
            <div id="network-state" class="network-state hidden"></div>

            <div class="list-header" aria-hidden="true">
                <span class="sortable" data-sort="id">ID ↕</span>
                <span class="sortable" data-sort="recipient">Recipient ↕</span>
                <span class="sortable" data-sort="destinationCity">City ↕</span>
                <span class="sortable" data-sort="status">Status ↕</span>
                <span class="sortable" data-sort="estimatedDelivery">Estimated Delivery ↕</span>
            </div>

            <ul id="shipments-list" class="shipments-list"></ul>

        </section>
    </main>

    <dialog id="shipment-dialog" class="app-dialog">
        <div class="dialog-content">
            <header class="dialog-header">
                <h2 id="dialog-title">Shipment Details</h2>
                <form method="dialog">
                    <button class="btn-close" aria-label="Close">✕</button>
                </form>
            </header>
            <div id="dialog-body" class="dialog-body"></div>
        </div>
    </dialog>

    <template id="shipment-template">
        <li class="shipment-card">
            <span class="shipment-id"></span>
            <span class="shipment-recipient"></span>
            <span class="shipment-city"></span>
            <span class="shipment-status"><span class="badge"></span></span>
            <span class="shipment-date"></span>
        </li>
    </template>

</body>
</html>
