<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack</title>

    <link rel="stylesheet" href="styles/core.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <script type="module" src="src/dashboard.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <h1>LogiTrack</h1>
        </div>
    </header>

    <aside class="app-sidebar" id="app-sidebar">
        <nav aria-label="Main Navigation" class="mobile-nav">
            <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-expanded="false" aria-controls="nav-list">
                <span>Dashboard</span>
                <span class="chevron" aria-hidden="true">▾</span>
            </button>
            <ul id="nav-list">
                <li><a href="#" class="active">Dashboard</a></li>
            </ul>
        </nav>
    </aside>

    <main class="app-main">
        <section class="filter-bar" aria-label="Filters and Search">

            <div class="toolbar">
                <div class="search-box">
                    <input type="search" id="search-input" placeholder="Search" aria-label="Search shipment">
                </div>
                <button id="filters-toggle" class="filters-toggle" data-action="toggle-filters" aria-expanded="false" aria-controls="filters-panel">
                    <span>Filters</span>
                    <span id="filters-count" class="filters-count" hidden></span>
                    <span class="chevron" aria-hidden="true">▾</span>
                </button>
                <div class="toolbar-actions">
                    <button id="btn-reset-data" class="btn-secondary" data-action="reset-data">Reset Data</button>
                    <button id="btn-new-shipment" class="btn-primary" data-action="new-shipment">+ New Shipment</button>
                </div>
            </div>

            <div id="filters-panel" class="filters-panel">
                <div class="dropdown" data-filter="status">
                    <button type="button" class="dropdown-toggle" aria-expanded="false" aria-haspopup="true">
                        <span class="filter-label">Status</span>
                        <span class="dropdown-value">All</span>
                        <span class="chevron" aria-hidden="true">▾</span>
                    </button>
                    <div class="dropdown-menu" role="menu">
                        <button type="button" class="dropdown-option active" role="menuitemradio" aria-checked="true" data-value="ALL">All</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="IN_TRANSIT">In Transit</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="DELIVERED">Delivered</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="DELAYED">Delayed</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="PENDING">Pending</button>
                    </div>
                </div>

                <div class="dropdown" data-filter="carrier">
                    <button type="button" class="dropdown-toggle" aria-expanded="false" aria-haspopup="true">
                        <span class="filter-label">Carrier</span>
                        <span class="dropdown-value">All</span>
                        <span class="chevron" aria-hidden="true">▾</span>
                    </button>
                    <div class="dropdown-menu" role="menu">
                        <button type="button" class="dropdown-option active" role="menuitemradio" aria-checked="true" data-value="ALL">All</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="DHL">DHL</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="Chronopost">Chronopost</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="FedEx">FedEx</button>
                        <button type="button" class="dropdown-option" role="menuitemradio" aria-checked="false" data-value="UPS">UPS</button>
                    </div>
                </div>

                <label class="priority-toggle">
                    <input type="checkbox" id="priority-only">
                    <span>Priority only</span>
                </label>
            </div>
        </section>

        <section class="shipments-section" aria-label="Shipment List">
            <div id="network-state" class="network-state hidden"></div>

            <div class="list-header">
                <button class="sortable" data-sort="trackingNumber">ID</button>
                <button class="sortable" data-sort="recipient">Recipient</button>
                <button class="sortable" data-sort="destinationCity">City</button>
                <button class="sortable" data-sort="carrier">Carrier</button>
                <button class="sortable" data-sort="status">Status</button>
                <button class="sortable" data-sort="estimatedDelivery">Estimated Delivery</button>
            </div>

            <ul id="shipments-list" class="shipments-list"></ul>

        </section>
    </main>

    <dialog id="shipment-dialog" class="app-dialog" aria-labelledby="dialog-title">
        <div class="dialog-content">
            <header class="dialog-header">
                <h2 id="dialog-title"></h2>
                <button type="button" class="btn-close" data-action="close" aria-label="Close">✕</button>
            </header>
            <div id="dialog-body" class="dialog-body"></div>
        </div>
    </dialog>

    <template id="shipment-template">
        <li class="shipment-card">
            <span class="shipment-id"></span>
            <span class="shipment-recipient"></span>
            <span class="shipment-city"></span>
            <span class="shipment-carrier"></span>
            <span class="shipment-status"><span class="badge"></span></span>
            <span class="shipment-date"></span>
        </li>
    </template>

    <template id="shipment-form-template">
        <form class="shipment-form" novalidate>
            <div class="form-grid">
                <label class="form-field">
                    <span>Recipient</span>
                    <input type="text" name="recipient" required autocomplete="off">
                </label>
                <label class="form-field">
                    <span>Destination City</span>
                    <input type="text" name="destinationCity" required autocomplete="off">
                </label>
                <label class="form-field">
                    <span>Carrier</span>
                    <select name="carrier" required>
                        <option value="DHL">DHL</option>
                        <option value="Chronopost">Chronopost</option>
                        <option value="FedEx">FedEx</option>
                        <option value="UPS">UPS</option>
                    </select>
                </label>
                <label class="form-field">
                    <span>Status</span>
                    <select name="status">
                        <option value="PENDING">Pending</option>
                        <option value="IN_TRANSIT">In Transit</option>
                        <option value="DELIVERED">Delivered</option>
                        <option value="DELAYED">Delayed</option>
                    </select>
                </label>
                <label class="form-field">
                    <span>Estimated Delivery</span>
                    <input type="date" name="estimatedDelivery">
                </label>
                <label class="form-check">
                    <input type="checkbox" name="isPriority">
                    <span>Priority shipment</span>
                </label>
                <label class="form-field form-field-full">
                    <span>Internal Notes</span>
                    <textarea name="internalNotes" rows="3"></textarea>
                </label>
            </div>
            <p class="form-error" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="btn-secondary" data-action="cancel">Cancel</button>
                <button type="submit" class="btn-primary" data-action="submit">Save</button>
            </div>
        </form>
    </template>

</body>
</html>
